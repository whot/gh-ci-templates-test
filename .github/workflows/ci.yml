name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  containers:
    uses: ./.github/workflows/containers.yml
    permissions:
      contents: read
      packages: write

  build:
    needs: containers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora-44
            image: fedora-image
          - name: ubuntu-24.04
            image: ubuntu-image
          - name: debian-bookworm
            image: debian-image
          - name: alpine-3.20
            image: alpine-image
    container: ${{ needs.containers.outputs[matrix.image] }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          meson setup build
          ninja -C build
      - name: Test
        run: meson test -C build
